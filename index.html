<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Board Games</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1 id="gameTitle">Board Games</h1>
  <div class="subtitle" id="subtitle">Choose a game to begin.</div>

  <div class="status-bar">
    <div class="status-item"><span class="status-dot a"></span><span id="turnLabel">Turn</span></div>
    <div class="status-divider"></div>
    <div class="status-item"><span class="status-dot b"></span><span id="pieceCount">&nbsp;</span></div>
  </div>

  <div class="board-wrap">
    <svg id="board" viewBox="0 0 450 450" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="controls">
    <button id="restartBtn">New Game</button>
    <button id="changeModeBtn">Change Mode</button>
  </div>

  <div class="rules-note" id="rulesNote"></div>

  <!-- Top-level game chooser -->
  <div class="overlay show" id="gameChoiceScreen">
    <div class="overlay-card">
      <h2>Choose a Game</h2>
      <p>Both are played on the same cross-line board.</p>
      <div class="game-pick-row">
        <button class="game-pick-btn" data-game="kap">
          <strong>Kings &amp; Pawns</strong>
          <span>2 Kings hunt 14 Pawns. Kings capture by sandwiching pawns; Pawns win by trapping both Kings.</span>
        </button>
        <button class="game-pick-btn" data-game="checkers">
          <strong>Checkers</strong>
          <span>Classic jump-capture checkers, adapted to this board's diagonal + straight lines. Forced captures, multi-jumps, promotion.</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Mode-select screen (shared, relabeled per game) -->
  <div class="overlay" id="startScreen">
    <div class="overlay-card">
      <h2 id="modeScreenTitle">Kings &amp; Pawns</h2>
      <p>Choose your side and opponent</p>

      <div class="mode-group">
        <div class="mode-label">Play as</div>
        <div class="mode-buttons" id="sideButtons">
          <button data-value="a" class="mode-btn active">King</button>
          <button data-value="b" class="mode-btn">Pawn</button>
        </div>
      </div>

      <div class="mode-group">
        <div class="mode-label">Opponent</div>
        <div class="mode-buttons" id="opponentButtons">
          <button data-value="ai" class="mode-btn active">AI</button>
          <button data-value="player" class="mode-btn">Local Player (2P)</button>
          <button data-value="online" class="mode-btn">Online</button>
        </div>
      </div>

      <div class="mode-group" id="onlinePanel" style="display:none;">
        <div class="mode-buttons" id="onlineTabButtons" style="margin-bottom:10px;">
          <button data-value="create" class="mode-btn active online-tab">Create Room</button>
          <button data-value="join" class="mode-btn online-tab">Join Room</button>
        </div>

        <div id="createTab">
          <button id="createRoomBtn" class="start-btn" style="margin-top:0;">Create Room</button>
          <div id="roomCodeDisplay" class="room-code" style="display:none;"></div>
        </div>

        <div id="joinTab" style="display:none;">
          <input id="joinCodeInput" class="room-input" placeholder="Enter room code" maxlength="6" autocapitalize="characters">
          <button id="joinRoomBtn" class="start-btn" style="margin-top:8px;">Join Room</button>
        </div>

        <div id="onlineStatus" class="online-status"></div>
      </div>

      <button id="startBtn" class="start-btn">Start Game</button>
      <div class="back-link" id="backToGameChoice">&larr; Choose a different game</div>
    </div>
  </div>

  <!-- Game over screen -->
  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <h2 id="overlayTitle">Kings Win!</h2>
      <p id="overlaySubtitle">All pawns have been captured.</p>
      <button id="overlayRestartBtn">Play Again</button>
      <button id="overlayModeBtn" style="margin-top:8px;">Change Mode</button>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
