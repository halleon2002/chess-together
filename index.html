<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Board Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #14181f;
    --panel: #1c222c;
    --line-dim: #6b6350;
    --point: #3a4150;
    --king: #d9973f;
    --king-glow: #f4c063;
    --pawn: #4f8fd1;
    --pawn-glow: #7db3ee;
    --white-pc: #eee6d4;
    --white-glow: #fffaf0;
    --black-pc: #2b3140;
    --black-glow: #4a5568;
    --legal: #5fbf7a;
    --capture: #e07a4a;
    --selected: #f4c063;
    --text: #eee6d4;
    --text-dim: #9aa0ad;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #1e2530 0%, var(--bg) 65%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    letter-spacing: 0.04em;
    margin: 4px 0 2px;
    text-align: center;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-bottom: 20px;
    text-align: center;
    min-height: 1.2em;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--panel);
    border: 1px solid #2c3341;
    border-radius: 14px;
    padding: 10px 22px;
    margin-bottom: 18px;
    font-family: 'Cinzel', serif;
  }

  .status-item { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
  .status-dot { width: 12px; height: 12px; border-radius: 50%; }
  .status-dot.a { background: var(--dot-a, var(--king)); box-shadow: 0 0 8px var(--dot-a-glow, var(--king-glow)); }
  .status-dot.b { background: var(--dot-b, var(--pawn)); box-shadow: 0 0 8px var(--dot-b-glow, var(--pawn-glow)); }
  .status-divider { width: 1px; height: 20px; background: #333c4c; }

  #turnLabel.active-a { color: var(--dot-a-glow, var(--king-glow)); }
  #turnLabel.active-b { color: var(--dot-b-glow, var(--pawn-glow)); }

  .board-wrap {
    position: relative;
    width: min(94vw, 480px);
    filter: drop-shadow(0 12px 28px rgba(0,0,0,0.45));
  }

  svg#board { width: 100%; height: auto; display: block; }

  .point-hit { cursor: default; }
  .point-hit.clickable { cursor: pointer; }

  .point-dot { transition: fill 0.15s ease; }
  .point-dot.legal { fill: var(--legal); }
  .point-dot.capture { fill: var(--capture); }
  .point-dot.selected { fill: var(--selected); }

  .piece-group { pointer-events: none; }

  .king-shape { fill: var(--king); }
  .pawn-shape { fill: var(--pawn); }
  .ck-white { fill: var(--white-pc); }
  .ck-black { fill: var(--black-pc); stroke: #8791a3; stroke-width: 1.5; }
  .ck-king-mark { fill: none; stroke-width: 2.5; }
  .ck-king-mark.on-white { stroke: var(--king); }
  .ck-king-mark.on-black { stroke: var(--king-glow); }

  .controls { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  button {
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    letter-spacing: 0.03em;
    background: var(--panel);
    color: var(--text);
    border: 1px solid #3a4356;
    border-radius: 10px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  button:hover { background: #262e3c; border-color: var(--king); }
  button:focus-visible { outline: 2px solid var(--king-glow); outline-offset: 2px; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 16, 0.82);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 16px;
  }
  .overlay.show { display: flex; }

  .overlay-card {
    background: var(--panel);
    border: 1px solid var(--line-dim);
    border-radius: 18px;
    padding: 32px 36px;
    text-align: center;
    max-width: 380px;
    width: 100%;
  }

  .overlay-card h2 {
    font-family: 'Cinzel', serif;
    font-size: 1.7rem;
    margin: 0 0 8px;
  }
  .overlay-card h2.a-win { color: var(--king-glow); }
  .overlay-card h2.b-win { color: var(--pawn-glow); }
  .overlay-card p { color: var(--text-dim); margin: 0 0 20px; font-size: 0.92rem; }

  .score-line {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1.15rem;
    margin: -6px 0 20px;
    padding: 10px;
    background: #232a36;
    border: 1px solid #333c4c;
    border-radius: 10px;
  }
  .score-line .score-a { color: var(--dot-a-glow, var(--king-glow)); }
  .score-line .score-b { color: var(--dot-b-glow, var(--pawn-glow)); }
  .score-line .score-sep { color: var(--text-dim); font-weight: 400; font-size: 0.9rem; }

  .game-pick-row { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
  .game-pick-btn {
    padding: 16px;
    font-size: 1.05rem;
    background: #232a36;
    border: 1px solid #333c4c;
    text-align: left;
  }
  .game-pick-btn strong { display: block; font-size: 1.1rem; margin-bottom: 4px; color: var(--king-glow); }
  .game-pick-btn span { font-family: 'Inter', sans-serif; font-size: 0.82rem; color: var(--text-dim); font-weight: 400; letter-spacing: 0; }
  .game-pick-btn:hover { border-color: var(--king-glow); }

  .mode-group { margin-bottom: 18px; text-align: left; }
  .mode-label {
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .mode-buttons { display: flex; gap: 8px; }
  .mode-btn {
    flex: 1;
    padding: 10px 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.88rem;
    background: #232a36;
    border: 1px solid #333c4c;
  }
  .mode-btn.active {
    background: rgba(217,151,63,0.18);
    border-color: var(--king-glow);
    color: var(--king-glow);
  }
  .start-btn {
    width: 100%;
    margin-top: 6px;
    background: var(--king);
    border-color: var(--king);
    color: #1c130a;
    font-weight: 700;
    padding: 12px;
  }
  .start-btn:hover { background: var(--king-glow); border-color: var(--king-glow); }

  .back-link {
    display: inline-block;
    margin-top: 14px;
    font-size: 0.8rem;
    color: var(--text-dim);
    cursor: pointer;
    text-decoration: underline;
  }
  .back-link:hover { color: var(--text); }

  .room-code {
    margin-top: 12px;
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--king-glow);
    background: #232a36;
    border: 1px dashed var(--king-glow);
    border-radius: 10px;
    padding: 10px;
  }

  .room-input {
    width: 100%;
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    letter-spacing: 0.1em;
    text-align: center;
    text-transform: uppercase;
    background: #232a36;
    border: 1px solid #333c4c;
    border-radius: 10px;
    color: var(--text);
    padding: 10px;
  }
  .room-input:focus { outline: none; border-color: var(--king-glow); }

  .online-status {
    margin-top: 12px;
    font-size: 0.85rem;
    color: var(--text-dim);
    text-align: center;
    min-height: 1.2em;
  }
  .online-status.error { color: #e07a7a; }
  .online-status.success { color: var(--legal); }

  .rules-note {
    max-width: 480px;
    margin-top: 26px;
    font-size: 0.82rem;
    line-height: 1.55;
    color: var(--text-dim);
    text-align: center;
  }
  .rules-note b { color: var(--text); }

  .lang-toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 20;
    padding: 8px 14px;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

  <button id="langToggle" class="lang-toggle">VI</button>

  <h1 id="gameTitle" data-i18n="appTitle">Board Games</h1>
  <div class="subtitle" id="subtitle" data-i18n="chooseGameToBegin">Choose a game to begin.</div>

  <div class="status-bar">
    <div class="status-item"><span class="status-dot a"></span><span id="turnLabel">Turn</span></div>
    <div class="status-divider"></div>
    <div class="status-item"><span class="status-dot b"></span><span id="pieceCount">&nbsp;</span></div>
  </div>

  <div class="board-wrap">
    <svg id="board" viewBox="0 0 450 450" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="controls">
    <button id="restartBtn" data-i18n="newGame">New Game</button>
    <button id="changeModeBtn" data-i18n="changeMode">Change Mode</button>
  </div>

  <div class="rules-note" id="rulesNote"></div>

  <!-- Top-level game chooser -->
  <div class="overlay show" id="gameChoiceScreen">
    <div class="overlay-card">
      <h2 data-i18n="chooseGameTitle">Choose a Game</h2>
      <p data-i18n="chooseGameSubtitle">Pick a game below.</p>
      <div class="game-pick-row">
        <button class="game-pick-btn" data-game="kap">
          <strong data-i18n="gcKapTitle">Kings &amp; Pawns</strong>
          
        </button>
        <button class="game-pick-btn" data-game="checkers">
          <strong data-i18n="gcCheckersTitle">Checkers</strong>
          
        </button>
        <button class="game-pick-btn" data-game="cothu">
          <strong data-i18n="gcCothuTitle">Cờ Thú (Jungle Chess)</strong>
          
        </button>
      </div>
    </div>
  </div>

  <!-- Mode-select screen (shared, relabeled per game) -->
  <div class="overlay" id="startScreen">
    <div class="overlay-card">
      <h2 id="modeScreenTitle">Kings &amp; Pawns</h2>
      <p data-i18n="modeScreenSubtitle">Choose your side and opponent</p>

      <div class="mode-group">
        <div class="mode-label" data-i18n="playAsLabel">Play as</div>
        <div class="mode-buttons" id="sideButtons">
          <button data-value="a" class="mode-btn active">King</button>
          <button data-value="b" class="mode-btn">Pawn</button>
        </div>
      </div>

      <div class="mode-group">
        <div class="mode-label" data-i18n="opponentLabel">Opponent</div>
        <div class="mode-buttons" id="opponentButtons">
          <button data-value="ai" class="mode-btn active" data-i18n="aiBtn">AI</button>
          <button data-value="player" class="mode-btn" data-i18n="localBtn">Local Player (2P)</button>
          <button data-value="online" class="mode-btn" data-i18n="onlineBtn">Online</button>
        </div>
      </div>

      <div class="mode-group" id="onlinePanel" style="display:none;">
        <div class="mode-buttons" id="onlineTabButtons" style="margin-bottom:10px;">
          <button data-value="create" class="mode-btn active online-tab" data-i18n="createRoomBtn">Create Room</button>
          <button data-value="join" class="mode-btn online-tab" data-i18n="joinRoomBtn">Join Room</button>
        </div>

        <div id="createTab">
          <button id="createRoomBtn" class="start-btn" style="margin-top:0;" data-i18n="createRoomBtn">Create Room</button>
          <div id="roomCodeDisplay" class="room-code" style="display:none;"></div>
        </div>

        <div id="joinTab" style="display:none;">
          <input id="joinCodeInput" class="room-input" data-i18n-placeholder="roomCodePlaceholder" placeholder="Enter room code" maxlength="6" autocapitalize="characters">
          <button id="joinRoomBtn" class="start-btn" style="margin-top:8px;" data-i18n="joinRoomBtn">Join Room</button>
        </div>

        <div id="onlineStatus" class="online-status"></div>
      </div>

      <button id="startBtn" class="start-btn" data-i18n="startGameBtn">Start Game</button>
      <div class="back-link" id="backToGameChoice" data-i18n="backToGameChoice">&larr; Choose a different game</div>
    </div>
  </div>

  <!-- Game over screen -->
  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <h2 id="overlayTitle">Kings Win!</h2>
      <p id="overlaySubtitle">All pawns have been captured.</p>
      <div id="scoreLine" class="score-line"></div>
      <button id="overlayRestartBtn" data-i18n="playAgainBtn">Play Again</button>
      <button id="overlayModeBtn" style="margin-top:8px;" data-i18n="changeMode">Change Mode</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ================= i18n (English / Vietnamese) =================
  let lang = "en";

  const I18N = {
    en: {
      appTitle: "Board Games",
      chooseGameToBegin: "Choose a game to begin.",
      newGame: "New Game",
      changeMode: "Change Mode",
      chooseGameTitle: "Choose a Game",
      chooseGameSubtitle: "Pick a game below.",
      gcKapTitle: "Kings & Pawns",
      gcKapDesc: "2 Kings hunt 14 Pawns. Kings capture by sandwiching pawns; Pawns win by trapping both Kings.",
      gcCheckersTitle: "Checkers",
      gcCheckersDesc: "Classic jump-capture checkers, adapted to this board's diagonal + straight lines. Forced captures, multi-jumps, promotion.",
      gcCothuTitle: "Cờ Thú (Jungle Chess)",
      gcCothuDesc: "Vietnamese animal chess on its own 7×9 board: rank-based captures, river, traps, and a Rat that can take down an Elephant. Win by reaching the enemy den.",
      modeScreenSubtitle: "Choose your side and opponent",
      playAsLabel: "Play as",
      opponentLabel: "Opponent",
      aiBtn: "AI",
      localBtn: "Local Player (2P)",
      onlineBtn: "Online",
      createRoomBtn: "Create Room",
      joinRoomBtn: "Join Room",
      roomCodePlaceholder: "Enter room code",
      startGameBtn: "Start Game",
      backToGameChoice: "← Choose a different game",
      playAgainBtn: "Play Again",
      gameOver: "Game Over",
      turnOf: (name) => `${name}'s Turn`,
      pawnsCount: (n) => `${n} pawns`,
      whiteBlackCount: (w,b) => `White ${w} – Black ${b}`,
      topBottomCount: (t,b) => `Top ${t} – Bottom ${b}`,
      winsSuffix: (name) => `${name} Wins!`,
      kapWinAllPawns: "All pawns have been captured.",
      kapWinTrapped: "Both Kings are trapped with no legal move.",
      noMovesLeft: "The opponent has no pieces or moves left.",
      cothuWinDen: "A piece marched straight into the enemy den!",
      subtitleLocal: "Local 2-player — pass the device each turn.",
      subtitleOnline: (name) => `Online match — you are ${name}.`,
      subtitleAI: (name) => `You are ${name}. The machine plays the other side.`,
      creatingRoom: "Creating room…",
      waitingForFriend: "Waiting for your friend to join…",
      connected: "Connected!",
      friendDisconnected: "Your friend disconnected.",
      connectionError: "Connection error.",
      connectionErrorCreate: (type) => `Connection error (${type}). Try creating a new room.`,
      connectionErrorJoin: (type) => `Connection error (${type}). Check the code and try again.`,
      enterRoomCodeFirst: "Enter a room code first.",
      connecting: "Connecting…",
      stillWaitingHint: "Still waiting after 30s — make sure your friend has the right room code and a stable connection.",
      connectTimeoutJoin: "Couldn't connect within 20 seconds. This usually means a firewall or VPN is blocking the connection. Try a different network, turn off any VPN, or try again.",
      scoreLine: (aLabel, aScore, bLabel, bScore) => `${aLabel} ${aScore} – ${bLabel} ${bScore}`
    },
    vi: {
      appTitle: "Trò Chơi Cờ",
      chooseGameToBegin: "Chọn một trò chơi để bắt đầu.",
      newGame: "Ván Mới",
      changeMode: "Đổi Chế Độ",
      chooseGameTitle: "Chọn Trò Chơi",
      chooseGameSubtitle: "Chọn một trò chơi bên dưới.",
      gcKapTitle: "Vua & Tốt",
      gcKapDesc: "2 Vua săn 14 Tốt. Vua ăn quân bằng cách kẹp Tốt giữa hai bên; Tốt thắng bằng cách dồn cả hai Vua vào thế bí.",
      gcCheckersTitle: "Cờ Nhào",
      gcCheckersDesc: "Cờ đam nhảy ăn quân truyền thống, chuyển thể sang đường chéo và đường thẳng của bàn cờ này. Ăn quân bắt buộc, ăn liên hoàn, phong Vương.",
      gcCothuTitle: "Cờ Thú",
      gcCothuDesc: "Cờ thú Việt Nam trên bàn cờ riêng 7×9: ăn quân theo hạng, có sông, có bẫy, và Chuột có thể hạ gục Tượng. Thắng bằng cách vào chuồng đối phương.",
      modeScreenSubtitle: "Chọn phe và đối thủ",
      playAsLabel: "Chơi làm",
      opponentLabel: "Đối thủ",
      aiBtn: "Máy",
      localBtn: "2 Người (cùng máy)",
      onlineBtn: "Trực tuyến",
      createRoomBtn: "Tạo Phòng",
      joinRoomBtn: "Vào Phòng",
      roomCodePlaceholder: "Nhập mã phòng",
      startGameBtn: "Bắt Đầu",
      backToGameChoice: "← Chọn trò chơi khác",
      playAgainBtn: "Chơi Lại",
      gameOver: "Kết Thúc",
      turnOf: (name) => `Lượt của ${name}`,
      pawnsCount: (n) => `${n} tốt`,
      whiteBlackCount: (w,b) => `Trắng ${w} – Đen ${b}`,
      topBottomCount: (t,b) => `Trên ${t} – Dưới ${b}`,
      winsSuffix: (name) => `${name} Thắng!`,
      kapWinAllPawns: "Tất cả tốt đã bị bắt.",
      kapWinTrapped: "Cả hai Vua đều bị chặn, không thể di chuyển.",
      noMovesLeft: "Đối thủ không còn quân hoặc nước đi nào.",
      cothuWinDen: "Một quân đã tiến thẳng vào chuồng đối phương!",
      subtitleLocal: "2 người chơi cùng máy — chuyền thiết bị mỗi lượt.",
      subtitleOnline: (name) => `Trận trực tuyến — bạn là ${name}.`,
      subtitleAI: (name) => `Bạn là ${name}. Máy chơi phe còn lại.`,
      creatingRoom: "Đang tạo phòng…",
      waitingForFriend: "Đang chờ bạn của bạn vào phòng…",
      connected: "Đã kết nối!",
      friendDisconnected: "Bạn của bạn đã ngắt kết nối.",
      connectionError: "Lỗi kết nối.",
      connectionErrorCreate: (type) => `Lỗi kết nối (${type}). Hãy tạo phòng mới.`,
      connectionErrorJoin: (type) => `Lỗi kết nối (${type}). Kiểm tra mã phòng và thử lại.`,
      enterRoomCodeFirst: "Vui lòng nhập mã phòng.",
      connecting: "Đang kết nối…",
      stillWaitingHint: "Vẫn chờ sau 30 giây — hãy kiểm tra bạn của bạn có đúng mã phòng và kết nối ổn định không.",
      connectTimeoutJoin: "Không thể kết nối sau 20 giây. Thường do tường lửa hoặc VPN chặn kết nối. Hãy thử mạng khác, tắt VPN, hoặc thử lại.",
      scoreLine: (aLabel, aScore, bLabel, bScore) => `${aLabel} ${aScore} – ${bLabel} ${bScore}`
    }
  };

  function t(key, ...args) {
    const entry = I18N[lang][key];
    return typeof entry === "function" ? entry(...args) : entry;
  }

  function applyStaticTranslations() {
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (I18N[lang][key] !== undefined) el.textContent = t(key);
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
      const key = el.getAttribute("data-i18n-placeholder");
      if (I18N[lang][key] !== undefined) el.placeholder = t(key);
    });
  }


  // ================= Shared board geometry (both games) =================
  const SIZE = 5;
  const PAD = 45;
  const SPACING = 90;

  function inBounds(p) { return p.x >= 0 && p.x < SIZE && p.y >= 0 && p.y < SIZE; }
  function isDiagCapable(p) {
    return (p.x % 2 === 0 && p.y % 2 === 0) || (p.x % 2 === 1 && p.y % 2 === 1);
  }
  function samePoint(a, b) { return a.x === b.x && a.y === b.y; }
  function coord(u) { return PAD + u * SPACING; }
  function cloneBoard(b) { return b.map(col => col.map(cell => (cell ? { ...cell } : null))); }
  function getPiece(b, p) { return b[p.x][p.y]; }
  function setPiece(b, p, v) { b[p.x][p.y] = v; }
  function allPoints() {
    const pts = [];
    for (let x = 0; x < SIZE; x++) for (let y = 0; y < SIZE; y++) pts.push({x,y});
    return pts;
  }
  function getPiecesOf(b, owner) {
    return allPoints().filter(p => { const pc = getPiece(b,p); return pc && pc.owner === owner; });
  }

  function getOrthogonalNeighbors(p) {
    const dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
    return dirs.map(d => ({x: p.x+d.x, y: p.y+d.y})).filter(inBounds);
  }
  function getDiagonalNeighbors(p) {
    if (!isDiagCapable(p)) return [];
    const dirs = [{x:1,y:1},{x:1,y:-1},{x:-1,y:1},{x:-1,y:-1}];
    return dirs.map(d => ({x: p.x+d.x, y: p.y+d.y})).filter(n => inBounds(n) && isDiagCapable(n));
  }
  function getAllNeighbors(p) { return getOrthogonalNeighbors(p).concat(getDiagonalNeighbors(p)); }

  // ================= KINGS & PAWNS MODULE =================
  const KAP = {};
  KAP.other = side => (side === "king" ? "pawn" : "king");

  KAP.createBoard = function () {
    const b = [];
    for (let x = 0; x < SIZE; x++) { b.push([]); for (let y = 0; y < SIZE; y++) b[x].push(null); }
    b[0][0] = { type: "king", owner: "king" };
    b[4][4] = { type: "king", owner: "king" };
    for (let x = 0; x < SIZE; x++) {
      for (let y = 0; y < SIZE; y++) {
        const isKingCorner = (x === 0 && y === 0) || (x === 4 && y === 4);
        const isBorder = x === 0 || x === SIZE - 1 || y === 0 || y === SIZE - 1;
        if (isBorder && !isKingCorner) b[x][y] = { type: "pawn", owner: "pawn" };
      }
    }
    return b;
  };

  KAP.getLegalMoves = function (b, from) {
    const piece = getPiece(b, from);
    if (!piece) return [];
    return getAllNeighbors(from).filter(n => !getPiece(b, n));
  };

  KAP.getSandwichCaptures = function (b, p) {
    const result = [];
    const axisPairs = [ [{x:-1,y:0},{x:1,y:0}], [{x:0,y:-1},{x:0,y:1}] ];
    if (isDiagCapable(p)) {
      axisPairs.push([{x:-1,y:-1},{x:1,y:1}]);
      axisPairs.push([{x:-1,y:1},{x:1,y:-1}]);
    }
    for (const [dA, dB] of axisPairs) {
      const a = {x: p.x+dA.x, y: p.y+dA.y};
      const c = {x: p.x+dB.x, y: p.y+dB.y};
      if (!inBounds(a) || !inBounds(c)) continue;
      const pa = getPiece(b, a), pc = getPiece(b, c);
      if (pa && pa.type === "pawn" && pc && pc.type === "pawn") { result.push(a); result.push(c); }
    }
    return result;
  };

  KAP.tryMove = function (b, from, to) {
    const piece = getPiece(b, from);
    if (!piece) return null;
    const legal = KAP.getLegalMoves(b, from);
    if (!legal.some(m => samePoint(m, to))) return null;
    setPiece(b, to, piece);
    setPiece(b, from, null);
    let captured = [];
    if (piece.type === "king") {
      captured = KAP.getSandwichCaptures(b, to);
      for (const c of captured) setPiece(b, c, null);
    }
    return { captured };
  };

  KAP.countPawns = function (b) { return getPiecesOf(b, "pawn").length; };
  KAP.anyLegalMoveFor = function (b, owner) { return getPiecesOf(b, owner).some(p => KAP.getLegalMoves(b, p).length > 0); };
  KAP.checkWinner = function (b) {
    if (KAP.countPawns(b) === 0) return "king";
    if (!KAP.anyLegalMoveFor(b, "king")) return "pawn";
    return null;
  };

  function chebyshev(a, b) { return Math.max(Math.abs(a.x-b.x), Math.abs(a.y-b.y)); }
  function distanceToNearestOwner(b, owner, point) {
    let best = Infinity;
    for (const p of getPiecesOf(b, owner)) best = Math.min(best, chebyshev(p, point));
    return best;
  }

  KAP.evaluatePawnMove = function (board, from, to) {
    const after = cloneBoard(board);
    KAP.tryMove(after, from, to);
    let score = 0;
    let worstCase = 0;
    for (const king of getPiecesOf(after, "king")) {
      for (const dest of KAP.getLegalMoves(after, king)) {
        const probe = cloneBoard(after);
        const res = KAP.tryMove(probe, king, dest);
        worstCase = Math.max(worstCase, res.captured.length);
      }
    }
    score -= worstCase * 50;
    let kingMobility = 0;
    for (const king of getPiecesOf(after, "king")) kingMobility += KAP.getLegalMoves(after, king).length;
    score -= kingMobility * 2;
    score += (distanceToNearestOwner(board, "king", from) - distanceToNearestOwner(after, "king", to)) * 3;
    if (kingMobility === 0) score += 10000;
    return score;
  };

  KAP.evaluateKingMove = function (board, from, to) {
    const after = cloneBoard(board);
    const result = KAP.tryMove(after, from, to);
    let score = result.captured.length * 100;
    const winner = KAP.checkWinner(after);
    if (winner === "pawn") score -= 100000;
    if (winner === "king") score += 100000;
    let kingMobility = 0;
    for (const king of getPiecesOf(after, "king")) kingMobility += KAP.getLegalMoves(after, king).length;
    score += kingMobility * 2;
    score += (distanceToNearestOwner(board, "pawn", from) - distanceToNearestOwner(after, "pawn", to)) * 3;
    return score;
  };

  KAP.chooseAIMove = function (board, side) {
    const pieces = getPiecesOf(board, side);
    const evalFn = side === "pawn" ? KAP.evaluatePawnMove : KAP.evaluateKingMove;
    const candidates = [];
    for (const piece of pieces) {
      for (const dest of KAP.getLegalMoves(board, piece)) {
        candidates.push({ from: piece, to: dest, score: evalFn(board, piece, dest) });
      }
    }
    if (candidates.length === 0) return null;
    candidates.sort((a,b) => b.score - a.score);
    const best = candidates[0].score;
    const top = candidates.filter(c => c.score >= best - 0.01);
    return top[Math.floor(Math.random() * top.length)];
  };

  // ================= CHECKERS MODULE =================
  const CK = {};
  CK.other = side => (side === "white" ? "black" : "white");
  const CK_ALL_DIRS = [
    {dx:-1,dy:-1},{dx:0,dy:-1},{dx:1,dy:-1},
    {dx:-1,dy:0},{dx:1,dy:0},
    {dx:-1,dy:1},{dx:0,dy:1},{dx:1,dy:1}
  ];

  CK.createBoard = function () {
    const b = [];
    for (let x = 0; x < SIZE; x++) { b.push([]); for (let y = 0; y < SIZE; y++) b[x].push(null); }
    for (let x = 0; x < SIZE; x++) {
      b[x][0] = { type: "man", owner: "white" };
      b[x][1] = { type: "man", owner: "white" };
      b[x][3] = { type: "man", owner: "black" };
      b[x][4] = { type: "man", owner: "black" };
    }
    return b;
  };

  function ckForwardSign(owner) { return owner === "white" ? 1 : -1; }
  function ckDirsFor(piece) {
    return CK_ALL_DIRS; // men move/capture one step in any direction this point connects to
  }
  function ckCanStep(a, dir) {
    const b = {x:a.x+dir.dx, y:a.y+dir.dy};
    if (!inBounds(b)) return false;
    if (dir.dx !== 0 && dir.dy !== 0) return isDiagCapable(a);
    return true;
  }

  // Flying-king slide: walk through empty points in one direction; if a single
  // enemy piece is hit followed by at least one empty point, that's a capture,
  // landable on ANY empty point beyond it (not just the very next one). Blocked
  // entirely by an own piece, or by an enemy piece with no empty point right after it.
  function ckSlideDir(board, point, dir, piece) {
    const moves = [];
    const captures = [];
    let cur = point;
    while (ckCanStep(cur, dir)) {
      const next = { x: cur.x + dir.dx, y: cur.y + dir.dy };
      const occ = getPiece(board, next);
      if (!occ) { moves.push(next); cur = next; continue; }
      if (occ.owner === piece.owner) break;
      let afterCur = next;
      while (ckCanStep(afterCur, dir)) {
        const landing = { x: afterCur.x + dir.dx, y: afterCur.y + dir.dy };
        if (getPiece(board, landing)) break;
        captures.push({ mid: next, landing });
        afterCur = landing;
      }
      break; // sliding always stops at the first non-empty point, capture or not
    }
    return { moves, captures };
  }

  CK.getPlainMoves = function (board, point) {
    const piece = getPiece(board, point);
    if (!piece) return [];
    if (piece.type === "king") {
      let moves = [];
      for (const dir of CK_ALL_DIRS) moves = moves.concat(ckSlideDir(board, point, dir, piece).moves);
      return moves;
    }
    const moves = [];
    for (const dir of ckDirsFor(piece)) {
      if (!ckCanStep(point, dir)) continue;
      const dest = {x:point.x+dir.dx, y:point.y+dir.dy};
      if (!getPiece(board, dest)) moves.push(dest);
    }
    return moves;
  };

  CK.getCaptures = function (board, point) {
    const piece = getPiece(board, point);
    if (!piece) return [];
    if (piece.type === "king") {
      let caps = [];
      for (const dir of CK_ALL_DIRS) caps = caps.concat(ckSlideDir(board, point, dir, piece).captures);
      return caps;
    }
    const caps = [];
    for (const dir of ckDirsFor(piece)) {
      if (!ckCanStep(point, dir)) continue;
      const mid = {x:point.x+dir.dx, y:point.y+dir.dy};
      const midPiece = getPiece(board, mid);
      if (!midPiece || midPiece.owner === piece.owner) continue;
      if (!ckCanStep(mid, dir)) continue;
      const landing = {x:mid.x+dir.dx, y:mid.y+dir.dy};
      if (getPiece(board, landing)) continue;
      caps.push({ mid, landing });
    }
    return caps;
  };

  CK.anyCaptureForOwner = function (board, owner) {
    return getPiecesOf(board, owner).some(p => CK.getCaptures(board, p).length > 0);
  };

  CK.promoteIfNeeded = function (board, point) {
    const piece = getPiece(board, point);
    if (!piece || piece.type === "king") return false;
    const farRow = piece.owner === "white" ? SIZE - 1 : 0;
    if (point.y === farRow) { setPiece(board, point, { type: "king", owner: piece.owner }); return true; }
    return false;
  };

  CK.applyPlainMove = function (board, from, to) {
    const piece = getPiece(board, from);
    setPiece(board, to, piece);
    setPiece(board, from, null);
    const promoted = CK.promoteIfNeeded(board, to);
    return { captured: [], promoted, landedAt: to };
  };

  CK.applyCapture = function (board, from, capture) {
    const piece = getPiece(board, from);
    setPiece(board, capture.landing, piece);
    setPiece(board, from, null);
    setPiece(board, capture.mid, null);
    const promoted = CK.promoteIfNeeded(board, capture.landing);
    return { captured: [capture.mid], promoted, landedAt: capture.landing };
  };

  CK.checkWinner = function (board, turnPlayer) {
    const pieces = getPiecesOf(board, turnPlayer);
    if (pieces.length === 0) return CK.other(turnPlayer);
    const hasMove = pieces.some(p => CK.getPlainMoves(board,p).length>0 || CK.getCaptures(board,p).length>0);
    if (!hasMove) return CK.other(turnPlayer);
    return null;
  };

  // Recursively enumerate every complete capture chain starting from a point.
  CK.enumerateChains = function (board, point) {
    const results = [];
    function dfs(curBoard, curPoint, path) {
      const caps = CK.getCaptures(curBoard, curPoint);
      if (caps.length === 0) { results.push(path); return; }
      for (const cap of caps) {
        const nb = cloneBoard(curBoard);
        CK.applyCapture(nb, curPoint, cap);
        dfs(nb, cap.landing, path.concat([cap]));
      }
    }
    dfs(board, point, []);
    return results.filter(r => r.length > 0);
  };

  CK.chooseAIMove = function (board, side) {
    const pieces = getPiecesOf(board, side);
    const candidates = [];

    // Every possible capture chain, scored by pieces captured + resulting safety.
    for (const p of pieces) {
      for (const chain of CK.enumerateChains(board, p)) {
        candidates.push({ kind: "capture", from: p, chain, score: CK.evaluateCaptureChain(board, p, chain, side) });
      }
    }
    // Every possible plain move.
    for (const p of pieces) {
      for (const dest of CK.getPlainMoves(board, p)) {
        candidates.push({ kind: "plain", from: p, to: dest, score: CK.evaluatePlainMove(board, p, dest, side) });
      }
    }

    if (candidates.length === 0) return null;
    candidates.sort((a,b) => b.score - a.score);
    const best = candidates[0].score;
    const top = candidates.filter(c => c.score >= best - 0.01);
    return top[Math.floor(Math.random() * top.length)];
  };

  CK.evaluateCaptureChain = function (board, from, chain, side) {
    const after = cloneBoard(board);
    let cur = from;
    for (const step of chain) { CK.applyCapture(after, cur, step); cur = step.landing; }
    let score = chain.length * 60; // capturing is usually strong, but no longer mandatory
    const opp = CK.other(side);
    let exposed = false;
    for (const op of getPiecesOf(after, opp)) {
      if (CK.getCaptures(after, op).some(c => samePoint(c.mid, cur))) { exposed = true; break; }
    }
    if (exposed) score -= 25;
    return score;
  };

  CK.evaluatePlainMove = function (board, from, to, side) {
    const after = cloneBoard(board);
    const result = CK.applyPlainMove(after, from, to);
    let score = 0;
    if (result.promoted) score += 50;
    // Mild preference to advance toward the far row (no longer required, just a nudge).
    const fs = ckForwardSign(side);
    score += (to.y - from.y) * fs * 4;
    // Avoid leaving this piece capturable next turn.
    const opp = CK.other(side);
    let exposed = false;
    for (const op of getPiecesOf(after, opp)) {
      if (CK.getCaptures(after, op).some(c => samePoint(c.mid, to))) { exposed = true; break; }
    }
    if (exposed) score -= 30;
    // Mild pull toward board center for better mobility.
    score -= (Math.abs(to.x - 2) + Math.abs(to.y - 2)) * 1;
    return score;
  };

  // ================= CỜ THÚ (JUNGLE CHESS) MODULE =================
  const CT = {};
  const CT_COLS = 7, CT_ROWS = 9;
  CT.RANK = { rat:1, cat:2, dog:3, wolf:4, leopard:5, tiger:6, lion:7, elephant:8 };
  CT.LETTER = { rat:"R", cat:"C", dog:"D", wolf:"W", leopard:"P", tiger:"T", lion:"L", elephant:"E" };
  CT.other = side => (side === "top" ? "bottom" : "top");

  function ctInBounds(p) { return p.x >= 0 && p.x < CT_COLS && p.y >= 0 && p.y < CT_ROWS; }
  function ctAllPoints() {
    const pts = [];
    for (let x = 0; x < CT_COLS; x++) for (let y = 0; y < CT_ROWS; y++) pts.push({x,y});
    return pts;
  }
  function ctGetPiecesOf(b, owner) {
    return ctAllPoints().filter(p => { const pc = getPiece(b,p); return pc && pc.owner === owner; });
  }

  const CT_RIVER = new Set();
  for (const c of [1,2,4,5]) for (const r of [3,4,5]) CT_RIVER.add(c+","+r);
  function ctIsRiver(p) { return CT_RIVER.has(p.x+","+p.y); }

  const CT_DEN = { top: {x:3,y:0}, bottom: {x:3,y:8} };
  function ctDenOwnerAt(p) { if (p.x===3&&p.y===0) return "top"; if (p.x===3&&p.y===8) return "bottom"; return null; }

  const CT_TRAPS = { top: [{x:2,y:0},{x:4,y:0},{x:3,y:1}], bottom: [{x:2,y:8},{x:4,y:8},{x:3,y:7}] };
  function ctTrapOwnerAt(p) {
    for (const t of CT_TRAPS.top) if (t.x===p.x && t.y===p.y) return "top";
    for (const t of CT_TRAPS.bottom) if (t.x===p.x && t.y===p.y) return "bottom";
    return null;
  }

  const CT_JUMP_LINES = [];
  for (const r of [3,4,5]) {
    CT_JUMP_LINES.push({a:{x:0,y:r}, b:{x:3,y:r}, through:[{x:1,y:r},{x:2,y:r}]});
    CT_JUMP_LINES.push({a:{x:3,y:r}, b:{x:6,y:r}, through:[{x:4,y:r},{x:5,y:r}]});
  }
  for (const c of [1,2,4,5]) {
    CT_JUMP_LINES.push({a:{x:c,y:2}, b:{x:c,y:6}, through:[{x:c,y:3},{x:c,y:4},{x:c,y:5}]});
  }

  CT.createBoard = function () {
    const b = []; for (let x=0;x<CT_COLS;x++){ b.push([]); for(let y=0;y<CT_ROWS;y++) b[x].push(null); }
    const place = (type,x,y,owner) => { b[x][y] = { type, owner }; };
    place("lion",0,0,"top"); place("tiger",6,0,"top");
    place("dog",1,1,"top"); place("cat",5,1,"top");
    place("rat",0,2,"top"); place("leopard",2,2,"top"); place("wolf",4,2,"top"); place("elephant",6,2,"top");
    place("tiger",0,8,"bottom"); place("lion",6,8,"bottom");
    place("cat",1,7,"bottom"); place("dog",5,7,"bottom");
    place("elephant",0,6,"bottom"); place("wolf",2,6,"bottom"); place("leopard",4,6,"bottom"); place("rat",6,6,"bottom");
    return b;
  };

  function ctEffectiveRank(board, p) {
    const piece = getPiece(board, p); if (!piece) return 0;
    const trapOwner = ctTrapOwnerAt(p);
    if (trapOwner && trapOwner !== piece.owner) return 0; // standing on an enemy trap: defenseless
    return CT.RANK[piece.type];
  }

  function ctCanCapture(board, attackerPos, defenderPos) {
    const atk = getPiece(board, attackerPos), def = getPiece(board, defenderPos);
    if (!atk || !def || atk.owner === def.owner) return false;
    if (atk.type === "rat" && def.type === "elephant") return true;
    if (atk.type === "elephant" && def.type === "rat") return false;
    return CT.RANK[atk.type] >= ctEffectiveRank(board, defenderPos);
  }

  function ctCanEnter(piece, dest) {
    if (ctIsRiver(dest) && piece.type !== "rat") return false;
    if (ctDenOwnerAt(dest) === piece.owner) return false; // can't enter your own den
    return true;
  }

  CT.getLegalMoves = function (board, point) {
    const piece = getPiece(board, point);
    if (!piece) return [];
    const moves = [];
    const dirs = [{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];
    for (const d of dirs) {
      const dest = {x:point.x+d.dx, y:point.y+d.dy};
      if (!ctInBounds(dest) || !ctCanEnter(piece, dest)) continue;
      const occ = getPiece(board, dest);
      if (!occ) moves.push({ to: dest, capture: false });
      else if (occ.owner !== piece.owner && ctCanCapture(board, point, dest)) moves.push({ to: dest, capture: true });
    }
    if (piece.type === "lion" || piece.type === "tiger") {
      for (const line of CT_JUMP_LINES) {
        let dest = null, through = null;
        if (samePoint(line.a, point)) { dest = line.b; through = line.through; }
        else if (samePoint(line.b, point)) { dest = line.a; through = line.through; }
        if (!dest) continue;
        const blocked = through.some(t => { const o = getPiece(board, t); return o && o.type === "rat"; });
        if (blocked || !ctCanEnter(piece, dest)) continue;
        const occ = getPiece(board, dest);
        if (!occ) moves.push({ to: dest, capture: false, jump: true });
        else if (occ.owner !== piece.owner && ctCanCapture(board, point, dest)) moves.push({ to: dest, capture: true, jump: true });
      }
    }
    return moves;
  };

  CT.applyMove = function (board, from, to) {
    const piece = getPiece(board, from);
    const capturedPiece = getPiece(board, to);
    setPiece(board, to, piece);
    setPiece(board, from, null);
    const wonByDen = ctDenOwnerAt(to) === CT.other(piece.owner);
    return { captured: capturedPiece ? to : null, wonByDen };
  };

  CT.checkWinner = function (board, turnPlayer) {
    const pieces = ctGetPiecesOf(board, turnPlayer);
    if (pieces.length === 0) return CT.other(turnPlayer);
    const hasMove = pieces.some(p => CT.getLegalMoves(board, p).length > 0);
    if (!hasMove) return CT.other(turnPlayer);
    return null;
  };

  CT.evaluateMove = function (board, from, mv, side) {
    const to = mv.to;
    const targetPiece = getPiece(board, to);
    let score = 0;
    if (targetPiece) score += CT.RANK[targetPiece.type] * 20;
    if (ctDenOwnerAt(to) === CT.other(side)) score += 100000;
    const after = cloneBoard(board);
    CT.applyMove(after, from, to);
    const opp = CT.other(side);
    let danger = 0;
    for (const op of ctGetPiecesOf(after, opp)) {
      for (const omv of CT.getLegalMoves(after, op)) {
        if (samePoint(omv.to, to) && omv.capture) danger = Math.max(danger, CT.RANK[getPiece(after,to).type]);
      }
    }
    score -= danger * 15;
    const denPos = CT_DEN[opp];
    const distBefore = Math.abs(from.x-denPos.x) + Math.abs(from.y-denPos.y);
    const distAfter = Math.abs(to.x-denPos.x) + Math.abs(to.y-denPos.y);
    score += (distBefore - distAfter) * 2;
    return score;
  };

  CT.chooseAIMove = function (board, side) {
    const pieces = ctGetPiecesOf(board, side);
    const candidates = [];
    for (const p of pieces) {
      for (const mv of CT.getLegalMoves(board, p)) {
        candidates.push({ from: p, to: mv.to, score: CT.evaluateMove(board, p, mv, side) });
      }
    }
    if (candidates.length === 0) return null;
    candidates.sort((a,b) => b.score - a.score);
    const best = candidates[0].score;
    const top = candidates.filter(c => c.score >= best - 0.01);
    return top[Math.floor(Math.random() * top.length)];
  };

  let lastWinner = null;

  function G() { return GAMES[activeGame]; }
  function otherSide(side) { return activeGame === "kap" ? KAP.other(side) : CK.other(side); }

  function isHumanTurn() {
    if (mode === "local") return true;
    if (mode === "online") return conn && conn.open && currentTurn === humanSide;
    return currentTurn === humanSide;
  }

  // ================= Rendering =================
  const svg = document.getElementById("board");
  const NS = "http://www.w3.org/2000/svg";
  const turnLabel = document.getElementById("turnLabel");
  const pieceCountLabel = document.getElementById("pieceCount");
  const subtitle = document.getElementById("subtitle");
  const gameTitle = document.getElementById("gameTitle");
  const rulesNote = document.getElementById("rulesNote");

  const sideButtons = document.getElementById("sideButtons");

  const lineLayer = document.createElementNS(NS, "g");
  const dotLayer = document.createElementNS(NS, "g");
  const pieceLayer = document.createElementNS(NS, "g");
  const hitLayer = document.createElementNS(NS, "g");
  svg.appendChild(lineLayer);
  svg.appendChild(dotLayer);
  svg.appendChild(pieceLayer);
  svg.appendChild(hitLayer);

  // ---- Cờ Thú (grid) rendering layers, coexisting with the lattice layers above ----
  const CT_CELL = 58, CT_PAD_X = 12, CT_PAD_Y = 12;
  const CT_VIEW_W = CT_COLS * CT_CELL + CT_PAD_X * 2;
  const CT_VIEW_H = CT_ROWS * CT_CELL + CT_PAD_Y * 2;
  function ctCoordX(col) { return CT_PAD_X + col * CT_CELL + CT_CELL / 2; }
  function ctCoordY(row) { return CT_PAD_Y + row * CT_CELL + CT_CELL / 2; }

  const ctTerrainLayer = document.createElementNS(NS, "g");
  const ctGridLayer = document.createElementNS(NS, "g");
  const ctPieceLayer = document.createElementNS(NS, "g");
  const ctHitLayer = document.createElementNS(NS, "g");
  svg.appendChild(ctTerrainLayer);
  svg.appendChild(ctGridLayer);
  svg.appendChild(ctPieceLayer);
  svg.appendChild(ctHitLayer);

  const ctPointEls = {};
  let ctBoardBuilt = false;

  function setBoardMode(isGrid) {
    const latDisplay = isGrid ? "none" : "";
    const ctDisplay = isGrid ? "" : "none";
    lineLayer.style.display = latDisplay; dotLayer.style.display = latDisplay;
    pieceLayer.style.display = latDisplay; hitLayer.style.display = latDisplay;
    ctTerrainLayer.style.display = ctDisplay; ctGridLayer.style.display = ctDisplay;
    ctPieceLayer.style.display = ctDisplay; ctHitLayer.style.display = ctDisplay;
    svg.setAttribute("viewBox", isGrid ? `0 0 ${CT_VIEW_W} ${CT_VIEW_H}` : "0 0 450 450");
    if (isGrid && !ctBoardBuilt) { buildCoThuBoard(); ctBoardBuilt = true; }
  }

  function buildCoThuBoard() {
    for (const p of ctAllPoints()) {
      const x = CT_PAD_X + p.x * CT_CELL, y = CT_PAD_Y + p.y * CT_CELL;
      const rect = document.createElementNS(NS, "rect");
      rect.setAttribute("x", x); rect.setAttribute("y", y);
      rect.setAttribute("width", CT_CELL); rect.setAttribute("height", CT_CELL);
      let fill = "transparent";
      if (ctIsRiver(p)) fill = "rgba(79,143,209,0.35)";
      else if (ctDenOwnerAt(p)) fill = "rgba(217,151,63,0.45)";
      else if (ctTrapOwnerAt(p)) fill = "rgba(224,122,74,0.3)";
      rect.setAttribute("fill", fill);
      ctTerrainLayer.appendChild(rect);

      const border = document.createElementNS(NS, "rect");
      border.setAttribute("x", x); border.setAttribute("y", y);
      border.setAttribute("width", CT_CELL); border.setAttribute("height", CT_CELL);
      border.setAttribute("fill", "none");
      border.setAttribute("stroke", "var(--line-dim)");
      border.setAttribute("stroke-width", "1.5");
      ctGridLayer.appendChild(border);

      const hit = document.createElementNS(NS, "rect");
      hit.setAttribute("x", x); hit.setAttribute("y", y);
      hit.setAttribute("width", CT_CELL); hit.setAttribute("height", CT_CELL);
      hit.setAttribute("fill", "transparent");
      hit.setAttribute("class", "point-hit");
      hit.addEventListener("click", () => onPointClicked(p));
      ctHitLayer.appendChild(hit);

      ctPointEls[p.x+","+p.y] = { hit, pieceGroup: null };
    }
  }

  function ctMakePieceShape(piece) {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "piece-group");
    const ring = document.createElementNS(NS, "circle");
    ring.setAttribute("cx", 0); ring.setAttribute("cy", 0); ring.setAttribute("r", 26);
    ring.style.fill = piece.owner === "top" ? "var(--king)" : "var(--pawn)";
    g.appendChild(ring);
    const img = document.createElementNS(NS, "image");
    const size = 50;
    img.setAttribute("href", CT_PIECE_IMAGES[piece.type]);
    img.setAttribute("x", -size/2); img.setAttribute("y", -size/2);
    img.setAttribute("width", size); img.setAttribute("height", size);
    g.appendChild(img);
    return g;
  }

  function ctPlaceGroupAt(group, point, animate) {
    const cx = ctCoordX(point.x), cy = ctCoordY(point.y);
    group.style.transition = animate ? "transform 0.28s ease" : "none";
    group.style.transform = `translate(${cx}px, ${cy}px)`;
  }

  function ctSyncPieces() {
    for (const p of ctAllPoints()) {
      const key = p.x+","+p.y;
      const entry = ctPointEls[key];
      if (entry.pieceGroup) { ctPieceLayer.removeChild(entry.pieceGroup); entry.pieceGroup = null; }
      const piece = getPiece(board, p);
      if (!piece) continue;
      const group = ctMakePieceShape(piece);
      ctPlaceGroupAt(group, p, false);
      ctPieceLayer.appendChild(group);
      entry.pieceGroup = group;
    }
  }

  function ctAnimateMove(from, to) {
    const fromEntry = ctPointEls[from.x+","+from.y];
    const toEntry = ctPointEls[to.x+","+to.y];
    const group = fromEntry.pieceGroup;
    fromEntry.pieceGroup = null;
    if (!group) return;

    // A piece already at the destination means this move captured it — fade
    // it out here (captures in Cờ Thú land on the same square as the victim,
    // unlike Checkers, so this can't be handled as a separate "capture" step).
    if (toEntry.pieceGroup) {
      const capturedGroup = toEntry.pieceGroup;
      toEntry.pieceGroup = null;
      capturedGroup.style.transition = "opacity 0.25s ease, transform 0.25s ease";
      capturedGroup.style.opacity = "0";
      const cx = ctCoordX(to.x), cy = ctCoordY(to.y);
      capturedGroup.style.transform = `translate(${cx}px, ${cy}px) scale(0.2)`;
      setTimeout(() => { if (capturedGroup.parentNode) ctPieceLayer.removeChild(capturedGroup); }, 260);
    }

    toEntry.pieceGroup = group;
    ctPlaceGroupAt(group, to, true);
  }


  function buildStaticLines() {
    const lines = [];
    const full = SIZE - 1;
    lines.push({x1:coord(0),y1:coord(0),x2:coord(full),y2:coord(0), w:4});
    lines.push({x1:coord(0),y1:coord(full),x2:coord(full),y2:coord(full), w:4});
    lines.push({x1:coord(0),y1:coord(0),x2:coord(0),y2:coord(full), w:4});
    lines.push({x1:coord(full),y1:coord(0),x2:coord(full),y2:coord(full), w:4});
    lines.push({x1:coord(2),y1:coord(0),x2:coord(2),y2:coord(full), w:4});
    lines.push({x1:coord(0),y1:coord(2),x2:coord(full),y2:coord(2), w:4});
    lines.push({x1:coord(1),y1:coord(0),x2:coord(1),y2:coord(full), w:1.5});
    lines.push({x1:coord(3),y1:coord(0),x2:coord(3),y2:coord(full), w:1.5});
    lines.push({x1:coord(0),y1:coord(1),x2:coord(full),y2:coord(1), w:1.5});
    lines.push({x1:coord(0),y1:coord(3),x2:coord(full),y2:coord(3), w:1.5});
    const quads = [[0,0],[2,0],[0,2],[2,2]];
    for (const [qx,qy] of quads) {
      lines.push({x1:coord(qx),y1:coord(qy),x2:coord(qx+2),y2:coord(qy+2), w:1.5});
      lines.push({x1:coord(qx+2),y1:coord(qy),x2:coord(qx),y2:coord(qy+2), w:1.5});
    }
    for (const l of lines) {
      const el = document.createElementNS(NS, "line");
      el.setAttribute("x1", l.x1); el.setAttribute("y1", l.y1);
      el.setAttribute("x2", l.x2); el.setAttribute("y2", l.y2);
      el.setAttribute("stroke", "var(--line-dim)");
      el.setAttribute("stroke-width", l.w);
      el.setAttribute("stroke-linecap", "round");
      el.style.pointerEvents = "none";
      lineLayer.appendChild(el);
    }
  }

  function shapeKing() {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "piece-group");
    const w = 17, h = 14, bandH = 6;
    const d = `M ${-w},${h-bandH} L ${-w},${h} L ${w},${h} L ${w},${h-bandH}
               L ${w*0.6},${-h*0.2} L ${w*0.25},${h*0.35} L 0,${-h}
               L ${-w*0.25},${h*0.35} L ${-w*0.6},${-h*0.2} Z`;
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    p.setAttribute("class", "king-shape");
    g.appendChild(p);
    return g;
  }

  function shapePawn() {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "piece-group");
    const head = document.createElementNS(NS, "circle");
    head.setAttribute("cx", 0); head.setAttribute("cy", -7); head.setAttribute("r", 8.5);
    head.setAttribute("class", "pawn-shape");
    g.appendChild(head);
    const base = document.createElementNS(NS, "path");
    base.setAttribute("d", `M -12,13 Q 0,3 12,13 Z`);
    base.setAttribute("class", "pawn-shape");
    g.appendChild(base);
    return g;
  }

  function shapeCheckers(piece) {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "piece-group");
    const disc = document.createElementNS(NS, "circle");
    disc.setAttribute("cx", 0); disc.setAttribute("cy", 0); disc.setAttribute("r", 15);
    disc.setAttribute("class", piece.owner === "white" ? "ck-white" : "ck-black");
    g.appendChild(disc);
    if (piece.type === "king") {
      const ring = document.createElementNS(NS, "circle");
      ring.setAttribute("cx", 0); ring.setAttribute("cy", 0); ring.setAttribute("r", 8);
      ring.setAttribute("class", "ck-king-mark " + (piece.owner === "white" ? "on-white" : "on-black"));
      g.appendChild(ring);
    }
    return g;
  }

  const pointEls = {};

  function buildPoints() {
    for (const p of allPoints()) {
      const cx = coord(p.x), cy = coord(p.y);

      const dot = document.createElementNS(NS, "circle");
      dot.setAttribute("cx", cx); dot.setAttribute("cy", cy); dot.setAttribute("r", 6);
      dot.setAttribute("fill", "var(--point)");
      dot.setAttribute("class", "point-dot");
      dot.style.pointerEvents = "none";
      dotLayer.appendChild(dot);

      const hit = document.createElementNS(NS, "circle");
      hit.setAttribute("cx", cx); hit.setAttribute("cy", cy); hit.setAttribute("r", 38);
      hit.setAttribute("fill", "transparent");
      hit.setAttribute("class", "point-hit");
      hit.addEventListener("click", () => onPointClicked(p));
      hitLayer.appendChild(hit);

      pointEls[p.x+","+p.y] = { hit, dot, pieceGroup: null };
    }
  }

  function makePieceShape(piece) {
    if (activeGame === "kap") return piece.type === "king" ? shapeKing() : shapePawn();
    return shapeCheckers(piece);
  }

  function placeGroupAt(group, point, animate) {
    const cx = coord(point.x), cy = coord(point.y);
    group.style.transition = animate ? "transform 0.28s ease" : "none";
    group.style.transform = `translate(${cx}px, ${cy}px)`;
  }

  // Full (non-animated) rebuild of every piece from the current board state.
  // Used only for initial setup and full board resets.
  function syncPieces() {
    for (const p of allPoints()) {
      const key = p.x+","+p.y;
      const entry = pointEls[key];
      if (entry.pieceGroup) { pieceLayer.removeChild(entry.pieceGroup); entry.pieceGroup = null; }
      const piece = getPiece(board, p);
      if (!piece) continue;
      const group = makePieceShape(piece);
      placeGroupAt(group, p, false);
      pieceLayer.appendChild(group);
      entry.pieceGroup = group;
    }
  }

  // Animate an existing piece sliding from one point to another (same DOM element).
  function animateMove(from, to) {
    const fromEntry = pointEls[from.x+","+from.y];
    const toEntry = pointEls[to.x+","+to.y];
    const group = fromEntry.pieceGroup;
    fromEntry.pieceGroup = null;
    if (!group) return;
    toEntry.pieceGroup = group;
    placeGroupAt(group, to, true);
  }

  // Fade + shrink a captured piece out, then remove it from the DOM.
  function animateCapture(at) {
    const entry = pointEls[at.x+","+at.y];
    const group = entry.pieceGroup;
    entry.pieceGroup = null;
    if (!group) return;
    group.style.transition = "opacity 0.25s ease, transform 0.25s ease";
    group.style.opacity = "0";
    const cx = coord(at.x), cy = coord(at.y);
    group.style.transform = `translate(${cx}px, ${cy}px) scale(0.2)`;
    setTimeout(() => { if (group.parentNode) pieceLayer.removeChild(group); }, 260);
  }

  // Re-render a single piece in place (e.g. after promotion changes its shape).
  function refreshPieceAt(point) {
    const entry = pointEls[point.x+","+point.y];
    if (entry.pieceGroup) { pieceLayer.removeChild(entry.pieceGroup); entry.pieceGroup = null; }
    const piece = getPiece(board, point);
    if (!piece) return;
    const group = makePieceShape(piece);
    placeGroupAt(group, point, false);
    pieceLayer.appendChild(group);
    entry.pieceGroup = group;
  }

  // Plays a completed multi-jump chain hop-by-hop (board state is already fully
  // applied; this just replays the visuals in sequence), then calls onComplete.
  function animateChainCaptures(from, steps, onComplete) {
    let idx = 0, cur = from;
    function next() {
      if (idx >= steps.length) { if (onComplete) onComplete(); return; }
      const s = steps[idx++];
      animateMove(cur, s.landing);
      animateCapture(s.mid);
      cur = s.landing;
      setTimeout(next, 300);
    }
    next();
  }

  function currentLegalPlain(point) {
    if (activeGame === "kap") return KAP.getLegalMoves(board, point);
    if (activeGame === "checkers") return CK.getPlainMoves(board, point);
    return CT.getLegalMoves(board, point).filter(m => !m.capture).map(m => m.to);
  }
  function currentLegalCaptures(point) {
    if (activeGame === "kap") return [];
    if (activeGame === "checkers") return CK.getCaptures(board, point);
    return CT.getLegalMoves(board, point).filter(m => m.capture).map(m => ({ landing: m.to }));
  }

  function refreshHighlights() {
    if (activeGame === "cothu") { ctRefreshHighlights(); return; }

    let plainDests = [], captureDests = [];
    if (selected) {
      plainDests = currentLegalPlain(selected);
      captureDests = currentLegalCaptures(selected).map(c => c.landing);
    }
    const humanTurn = isHumanTurn();

    for (const p of allPoints()) {
      const entry = pointEls[p.x+","+p.y];
      const isSelected = selected && samePoint(selected, p);
      const isCapture = captureDests.some(m => samePoint(m, p));
      const isPlain = !isCapture && plainDests.some(m => samePoint(m, p));
      entry.dot.classList.toggle("selected", !!isSelected);
      entry.dot.classList.toggle("capture", !!isCapture);
      entry.dot.classList.toggle("legal", !!isPlain);
      if (!isSelected && !isCapture && !isPlain) entry.dot.setAttribute("fill", "var(--point)");

      const piece = getPiece(board, p);
      let clickable = !isGameOver && humanTurn;
      if (clickable) {
        if (ckPendingFrom) {
          clickable = samePoint(p, ckPendingFrom) || isCapture;
        } else if (piece && piece.owner === currentTurn) {
          clickable = true;
        } else {
          clickable = isPlain || isCapture;
        }
      }
      entry.hit.classList.toggle("clickable", !!clickable);
    }
  }

  function ctRefreshHighlights() {
    let dests = [];
    if (selected) dests = CT.getLegalMoves(board, selected).map(m => m.to);
    const humanTurn = isHumanTurn();

    for (const p of ctAllPoints()) {
      const entry = ctPointEls[p.x+","+p.y];
      const isSelected = selected && samePoint(selected, p);
      const isDest = dests.some(m => samePoint(m, p));
      entry.hit.classList.remove("legal-marker");
      if (entry._marker) { entry.hit.parentNode && ctHitLayer.removeChild(entry._marker); entry._marker = null; }
      if (isSelected || isDest) {
        const marker = document.createElementNS(NS, "circle");
        marker.setAttribute("cx", ctCoordX(p.x));
        marker.setAttribute("cy", ctCoordY(p.y));
        marker.setAttribute("r", isSelected ? 27 : 8);
        marker.setAttribute("fill", isSelected ? "none" : "var(--legal)");
        marker.setAttribute("stroke", isSelected ? "var(--selected)" : "none");
        marker.setAttribute("stroke-width", "3");
        marker.style.pointerEvents = "none";
        ctHitLayer.insertBefore(marker, entry.hit);
        entry._marker = marker;
      }

      const piece = getPiece(board, p);
      let clickable = !isGameOver && humanTurn;
      if (clickable) {
        if (piece && piece.owner === currentTurn) clickable = true;
        else clickable = isDest;
      }
      entry.hit.classList.toggle("clickable", !!clickable);
    }
  }

  function sideLabel(g, isA) {
    return (isA ? g.sideA.label : g.sideB.label)[lang];
  }
  function gameTitleText(g) { return g.title[lang]; }
  function rulesNoteHtml(g) { return g.rulesNote[lang]; }

  function updateStatus() {
    const g = G();
    const turnIsA = currentTurn === g.sideA.key;
    const label = sideLabel(g, turnIsA);
    turnLabel.textContent = isGameOver ? t("gameOver") : t("turnOf", label);
    turnLabel.classList.toggle("active-a", turnIsA && !isGameOver);
    turnLabel.classList.toggle("active-b", !turnIsA && !isGameOver);

    if (activeGame === "kap") {
      pieceCountLabel.textContent = t("pawnsCount", KAP.countPawns(board));
    } else if (activeGame === "checkers") {
      const w = getPiecesOf(board, "white").length, bl = getPiecesOf(board, "black").length;
      pieceCountLabel.textContent = t("whiteBlackCount", w, bl);
    } else {
      const top = ctGetPiecesOf(board, "top").length, bo = ctGetPiecesOf(board, "bottom").length;
      pieceCountLabel.textContent = t("topBottomCount", top, bo);
    }
  }

  function applyThemeColors() {
    const g = G();
    document.documentElement.style.setProperty("--dot-a", g.colors.a);
    document.documentElement.style.setProperty("--dot-a-glow", g.colors.aGlow);
    document.documentElement.style.setProperty("--dot-b", g.colors.b);
    document.documentElement.style.setProperty("--dot-b-glow", g.colors.bGlow);
    gameTitle.textContent = gameTitleText(g);
    rulesNote.innerHTML = rulesNoteHtml(g);
  }

  function updateSubtitle() {
    const g = G();
    if (mode === "local") { subtitle.textContent = t("subtitleLocal"); return; }
    const label = sideLabel(g, humanSide === g.sideA.key);
    if (mode === "online") { subtitle.textContent = t("subtitleOnline", label); return; }
    subtitle.textContent = t("subtitleAI", label);
  }

  function renderGameOverPanel(winner) {
    const g = G();
    overlay.classList.add("show");
    const isA = winner === g.sideA.key;
    overlayTitle.textContent = t("winsSuffix", sideLabel(g, isA));
    overlayTitle.className = isA ? "a-win" : "b-win";
    if (activeGame === "kap") {
      overlaySubtitle.textContent = winner === "king" ? t("kapWinAllPawns") : t("kapWinTrapped");
    } else if (activeGame === "checkers") {
      overlaySubtitle.textContent = t("noMovesLeft");
    } else {
      overlaySubtitle.textContent = lastCtWinWasDen ? t("cothuWinDen") : t("noMovesLeft");
    }
    renderScoreLine();
  }

  function showGameOver(winner) {
    lastWinner = winner;
    const g = G();
    const isA = winner === g.sideA.key;
    if (isA) score.a++; else score.b++;
    renderGameOverPanel(winner);
  }

  function renderScoreLine() {
    const g = G();
    scoreLineEl.innerHTML =
      `<span class="score-a">${sideLabel(g, true)} ${score.a}</span>` +
      `<span class="score-sep">–</span>` +
      `<span class="score-b">${sideLabel(g, false)} ${score.b}</span>`;
  }

  function resetScore() {
    score = { a: 0, b: 0 };
  }

  // ================= Online networking =================
  // Fill these in with your free Metered.ca (https://www.metered.ca/tools/openrelay/)
  // subdomain + API key to enable TURN relay for connections across strict NATs/firewalls.
  // Without these, only STUN is used, which fails for some cross-network connections.
  const TURN_CONFIG = {
    meteredSubdomain: "chess-together", // e.g. "myproject" (becomes myproject.metered.live)
    meteredApiKey: "df354fde4eb1f9d614b8afebb574078d2830"
  };
  const STUN_FALLBACK = [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" }
  ];
  async function getIceServers() {
    if (!TURN_CONFIG.meteredSubdomain || !TURN_CONFIG.meteredApiKey) return STUN_FALLBACK;
    try {
      const res = await fetch(`https://${TURN_CONFIG.meteredSubdomain}.metered.live/api/v1/turn/credentials?apiKey=${TURN_CONFIG.meteredApiKey}`);
      const servers = await res.json();
      return (Array.isArray(servers) && servers.length) ? servers : STUN_FALLBACK;
    } catch (e) {
      return STUN_FALLBACK;
    }
  }

  function setOnlineStatus(text, cls) {
    onlineStatus.textContent = text || "";
    onlineStatus.className = "online-status" + (cls ? " " + cls : "");
  }
  function randomRoomCode(len) {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let code = "";
    for (let i = 0; i < len; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  }
  function teardownConnection() {
    if (peer) { try { peer.destroy(); } catch (e) {} }
    peer = null; conn = null;
    clearConnectTimeout();
  }
  let connectTimeoutId = null;
  function clearConnectTimeout() {
    if (connectTimeoutId) { clearTimeout(connectTimeoutId); connectTimeoutId = null; }
  }

  async function createRoom() {
    teardownConnection();
    isHost = true;
    const code = randomRoomCode(4);
    roomCodeDisplay.style.display = "none";
    setOnlineStatus(t("creatingRoom"));
    const iceServers = await getIceServers();
    peer = new Peer(ROOM_PREFIX + code.toLowerCase(), { config: { iceServers } });
    peer.on("open", () => {
      roomCodeDisplay.style.display = "block";
      roomCodeDisplay.textContent = code;
      setOnlineStatus(t("waitingForFriend"));
      clearConnectTimeout();
      connectTimeoutId = setTimeout(() => {
        if (!conn) setOnlineStatus(t("stillWaitingHint"), "error");
      }, 30000);
    });
    peer.on("connection", incoming => {
      clearConnectTimeout();
      conn = incoming;
      setupConnection();
    });
    peer.on("error", err => { clearConnectTimeout(); setOnlineStatus(t("connectionErrorCreate", err.type), "error"); });
  }
  async function joinRoom(codeRaw) {
    const code = (codeRaw || "").trim().toLowerCase();
    if (!code) { setOnlineStatus(t("enterRoomCodeFirst"), "error"); return; }
    teardownConnection();
    isHost = false;
    setOnlineStatus(t("connecting"));
    const iceServers = await getIceServers();
    peer = new Peer({ config: { iceServers } });
    peer.on("open", () => {
      conn = peer.connect(ROOM_PREFIX + code, { reliable: true });
      setupConnection();
      clearConnectTimeout();
      connectTimeoutId = setTimeout(() => {
        if (!conn || !conn.open) {
          setOnlineStatus(t("connectTimeoutJoin"), "error");
          teardownConnection();
        }
      }, 20000);
    });
    peer.on("error", err => { clearConnectTimeout(); setOnlineStatus(t("connectionErrorJoin", err.type), "error"); });
  }

  // Logs WebRTC ICE/connection state changes to the browser console (F12) —
  // useful for diagnosing why a specific connection fails (blocked UDP/TCP,
  // no TURN candidates gathered, etc.) without changing what the user sees.
  function logIceDiagnostics() {
    setTimeout(() => {
      const pc = conn && conn.peerConnection;
      if (!pc) return;
      pc.addEventListener("iceconnectionstatechange", () => {
        console.log("[WebRTC] ICE connection state:", pc.iceConnectionState);
      });
      pc.addEventListener("icegatheringstatechange", () => {
        console.log("[WebRTC] ICE gathering state:", pc.iceGatheringState);
      });
      pc.addEventListener("connectionstatechange", () => {
        console.log("[WebRTC] Connection state:", pc.connectionState);
      });
    }, 50);
  }

  function setupConnection() {
    logIceDiagnostics();
    conn.on("open", () => {
      clearConnectTimeout();
      setOnlineStatus(t("connected"), "success");
      if (isHost) {
        conn.send({ type: "assignSide", game: activeGame, side: otherSide(humanSide) });
        beginOnlineGame();
      }
    });
    conn.on("data", onData);
    conn.on("close", () => setOnlineStatus(t("friendDisconnected"), "error"));
    conn.on("error", () => setOnlineStatus(t("connectionError"), "error"));
  }
  function onData(msg) {
    if (!msg || !msg.type) return;
    if (msg.type === "assignSide") {
      activeGame = msg.game;
      humanSide = msg.side;
      beginOnlineGame();
    } else if (msg.type === "kapMove") {
      const result = KAP.tryMove(board, msg.from, msg.to);
      afterKapMove({ broadcast: false, from: msg.from, to: msg.to, captured: result ? result.captured : [] });
    } else if (msg.type === "ckPlain") {
      const result = CK.applyPlainMove(board, msg.from, msg.to);
      animateMove(msg.from, msg.to);
      if (result.promoted) setTimeout(() => refreshPieceAt(msg.to), 280);
      finishCheckersTurn({ broadcast: false });
    } else if (msg.type === "ckCapture") {
      let cur = msg.from;
      for (const step of msg.steps) { CK.applyCapture(board, cur, step); cur = step.landing; }
      const finalPos = msg.steps[msg.steps.length - 1].landing;
      animateChainCaptures(msg.from, msg.steps, () => {
        refreshPieceAt(finalPos);
        finishCheckersTurn({ broadcast: false });
      });
    } else if (msg.type === "restart") {
      resetBoardLocal();
    } else if (msg.type === "ctMove") {
      const result = CT.applyMove(board, msg.from, msg.to);
      ctAnimateMove(msg.from, msg.to);
      finishCoThuTurn({ broadcast: false, wonByDen: result.wonByDen, mover: currentTurn });
    }
  }
  function beginOnlineGame() {
    mode = "online";
    startScreen.classList.remove("show");
    applyThemeColors();
    updateSubtitle();
    resetScore();
    resetBoardLocal();
  }

  // ================= Interaction: dispatch by active game =================
  function onPointClicked(p) {
    if (isGameOver || !isHumanTurn()) return;
    if (activeGame === "kap") onKapPointClicked(p);
    else if (activeGame === "checkers") onCheckersPointClicked(p);
    else onCoThuPointClicked(p);
  }

  // ---- Kings & Pawns interaction ----
  function onKapPointClicked(p) {
    if (selected) {
      const from = selected;
      const result = KAP.tryMove(board, from, p);
      if (result) { selected = null; afterKapMove({ broadcast: true, from, to: p, captured: result.captured }); return; }
      const piece = getPiece(board, p);
      if (piece && piece.owner === currentTurn) { selected = p; refreshHighlights(); return; }
      selected = null; refreshHighlights();
      return;
    }
    const piece = getPiece(board, p);
    if (piece && piece.owner === currentTurn) { selected = p; refreshHighlights(); }
  }

  function afterKapMove(opts) {
    opts = opts || {};
    if (opts.from && opts.to) animateMove(opts.from, opts.to);
    if (opts.captured) for (const c of opts.captured) animateCapture(c);
    if (mode === "online" && opts.broadcast && conn && conn.open) {
      conn.send({ type: "kapMove", from: opts.from, to: opts.to });
    }
    const winner = KAP.checkWinner(board);
    if (winner) {
      isGameOver = true; updateStatus(); refreshHighlights();
      setTimeout(() => showGameOver(winner), 300);
      return;
    }
    currentTurn = KAP.other(currentTurn);
    updateStatus(); refreshHighlights();
    if (mode === "ai") maybeTriggerAI();
  }

  // ---- Checkers interaction ----
  function onCheckersPointClicked(p) {
    if (ckPendingFrom) {
      const caps = CK.getCaptures(board, ckPendingFrom);
      const match = caps.find(c => samePoint(c.landing, p));
      if (match) performCheckersCapture(match);
      return;
    }

    if (selected) {
      const caps = CK.getCaptures(board, selected);
      const capMatch = caps.find(c => samePoint(c.landing, p));
      if (capMatch) {
        ckChainOrigin = selected;
        ckChainSteps = [];
        performCheckersCapture(capMatch);
        return;
      }

      const plains = CK.getPlainMoves(board, selected);
      if (plains.some(m => samePoint(m, p))) { performCheckersPlain(selected, p); return; }

      const clicked = getPiece(board, p);
      if (clicked && clicked.owner === currentTurn) { selected = p; refreshHighlights(); return; }
      selected = null; refreshHighlights();
      return;
    }

    const piece = getPiece(board, p);
    if (piece && piece.owner === currentTurn) {
      selected = p; refreshHighlights();
    }
  }

  function performCheckersPlain(from, to) {
    const result = CK.applyPlainMove(board, from, to);
    selected = null;
    animateMove(from, to);
    if (result.promoted) setTimeout(() => refreshPieceAt(to), 280);
    finishCheckersTurn({ broadcast: true, kind: "plain", from, to });
  }

  function performCheckersCapture(capture) {
    const from = ckPendingFrom || selected;
    const result = CK.applyCapture(board, from, capture);
    ckChainSteps.push(capture);
    const landedAt = result.landedAt;
    animateMove(from, landedAt);
    animateCapture(capture.mid);

    const canContinue = CK.getCaptures(board, landedAt).length > 0;
    if (canContinue) {
      ckPendingFrom = landedAt;
      selected = landedAt;
      updateStatus(); refreshHighlights();
      return;
    }

    const finalFrom = ckChainOrigin;
    const finalSteps = ckChainSteps;
    ckPendingFrom = null; ckChainOrigin = null; ckChainSteps = [];
    selected = null;
    // Always refresh (not just when this specific hop promoted it) — promotion
    // may have happened on an earlier hop in the chain, in which case this final
    // hop's own "promoted" flag correctly comes back false (already a King).
    setTimeout(() => refreshPieceAt(landedAt), 280);
    finishCheckersTurn({ broadcast: true, kind: "capture", from: finalFrom, steps: finalSteps });
  }

  function finishCheckersTurn(opts) {
    opts = opts || {};
    if (mode === "online" && opts.broadcast && conn && conn.open) {
      if (opts.kind === "plain") conn.send({ type: "ckPlain", from: opts.from, to: opts.to });
      else if (opts.kind === "capture") conn.send({ type: "ckCapture", from: opts.from, steps: opts.steps });
    }
    currentTurn = CK.other(currentTurn);
    const winner = CK.checkWinner(board, currentTurn);
    if (winner) {
      isGameOver = true; updateStatus(); refreshHighlights();
      setTimeout(() => showGameOver(winner), 300);
      return;
    }
    updateStatus(); refreshHighlights();
    if (mode === "ai") maybeTriggerAI();
  }

  // ---- Cờ Thú interaction ----
  function onCoThuPointClicked(p) {
    if (selected) {
      const moves = CT.getLegalMoves(board, selected);
      const match = moves.find(m => samePoint(m.to, p));
      if (match) { performCoThuMove(selected, p); return; }

      const clicked = getPiece(board, p);
      if (clicked && clicked.owner === currentTurn) { selected = p; refreshHighlights(); return; }
      selected = null; refreshHighlights();
      return;
    }
    const piece = getPiece(board, p);
    if (piece && piece.owner === currentTurn) { selected = p; refreshHighlights(); }
  }

  function performCoThuMove(from, to) {
    const result = CT.applyMove(board, from, to);
    selected = null;
    ctAnimateMove(from, to);
    finishCoThuTurn({ broadcast: true, from, to, wonByDen: result.wonByDen, mover: currentTurn });
  }

  function finishCoThuTurn(opts) {
    opts = opts || {};
    if (mode === "online" && opts.broadcast && conn && conn.open) {
      conn.send({ type: "ctMove", from: opts.from, to: opts.to });
    }
    if (opts.wonByDen) {
      isGameOver = true;
      lastCtWinWasDen = true;
      updateStatus(); refreshHighlights();
      setTimeout(() => showGameOver(opts.mover), 300);
      return;
    }
    currentTurn = CT.other(currentTurn);
    const winner = CT.checkWinner(board, currentTurn);
    if (winner) {
      isGameOver = true;
      lastCtWinWasDen = false;
      updateStatus(); refreshHighlights();
      setTimeout(() => showGameOver(winner), 300);
      return;
    }
    updateStatus(); refreshHighlights();
    if (mode === "ai") maybeTriggerAI();
  }

  // ================= AI dispatch =================
  function maybeTriggerAI() {
    if (isGameOver) return;
    if (mode === "ai" && currentTurn !== humanSide) setTimeout(() => aiMove(currentTurn), 550);
  }

  function aiMove(side) {
    if (isGameOver || currentTurn !== side) return;
    if (activeGame === "kap") {
      const move = KAP.chooseAIMove(board, side);
      if (!move) return;
      const result = KAP.tryMove(board, move.from, move.to);
      afterKapMove({ broadcast: false, from: move.from, to: move.to, captured: result.captured });
    } else if (activeGame === "checkers") {
      const move = CK.chooseAIMove(board, side);
      if (!move) return;
      if (move.kind === "plain") {
        const result = CK.applyPlainMove(board, move.from, move.to);
        animateMove(move.from, move.to);
        if (result.promoted) setTimeout(() => refreshPieceAt(move.to), 280);
        finishCheckersTurn({ broadcast: false });
      } else {
        let cur = move.from;
        for (const step of move.chain) { CK.applyCapture(board, cur, step); cur = step.landing; }
        const finalPos = move.chain[move.chain.length - 1].landing;
        animateChainCaptures(move.from, move.chain, () => {
          refreshPieceAt(finalPos);
          finishCheckersTurn({ broadcast: false });
        });
      }
    } else {
      const move = CT.chooseAIMove(board, side);
      if (!move) return;
      const result = CT.applyMove(board, move.from, move.to);
      ctAnimateMove(move.from, move.to);
      finishCoThuTurn({ broadcast: false, wonByDen: result.wonByDen, mover: side });
    }
  }

  // ================= Reset / mode flow =================
  function resetBoardLocal() {
    setBoardMode(activeGame === "cothu");
    if (activeGame === "kap") board = KAP.createBoard();
    else if (activeGame === "checkers") board = CK.createBoard();
    else board = CT.createBoard();
    currentTurn = G().firstTurn;
    selected = null;
    isGameOver = false;
    ckPendingFrom = null;
    ckChainOrigin = null;
    ckChainSteps = [];
    overlay.classList.remove("show");
    if (activeGame === "cothu") ctSyncPieces(); else syncPieces();
    updateStatus();
    refreshHighlights();
  }

  function restart() {
    resetBoardLocal();
    if (mode === "online" && conn && conn.open) conn.send({ type: "restart" });
    if (mode === "ai") maybeTriggerAI();
  }

  function openModeScreen() {
    overlay.classList.remove("show");
    teardownConnection();
    onlinePanel.style.display = "none";
    startBtn.style.display = "block";
    roomCodeDisplay.style.display = "none";
    setOnlineStatus("");
    startScreen.classList.add("show");
  }

  function openGameChoiceScreen() {
    teardownConnection();
    startScreen.classList.remove("show");
    overlay.classList.remove("show");
    gameChoiceScreen.classList.add("show");
  }

  function selectGame(gameKey) {
    activeGame = gameKey;
    const g = G();
    humanSide = g.sideA.key;
    mode = "ai";
    resetScore();
    modeScreenTitle.textContent = gameTitleText(g);
    const sideBtns = sideButtons.querySelectorAll(".mode-btn");
    sideBtns[0].textContent = sideLabel(g, true); sideBtns[0].dataset.value = "a";
    sideBtns[1].textContent = sideLabel(g, false); sideBtns[1].dataset.value = "b";
    sideBtns.forEach((b,i) => b.classList.toggle("active", i === 0));
    onlinePanel.style.display = "none";
    startBtn.style.display = "block";
    document.getElementById("opponentButtons").querySelectorAll(".mode-btn").forEach((b,i) => b.classList.toggle("active", i === 0));
    gameChoiceScreen.classList.remove("show");
    startScreen.classList.add("show");
  }

  // ================= Wiring =================
  document.querySelectorAll(".game-pick-btn").forEach(btn => {
    btn.addEventListener("click", () => selectGame(btn.dataset.game));
  });

  function wireToggleGroup(containerId, onChange) {
    const container = document.getElementById(containerId);
    const buttons = container.querySelectorAll(".mode-btn");
    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        onChange(btn.dataset.value);
      });
    });
  }

  wireToggleGroup("sideButtons", value => { humanSide = value === "a" ? G().sideA.key : G().sideB.key; });
  wireToggleGroup("opponentButtons", value => {
    mode = value === "player" ? "local" : value;
    const showOnline = mode === "online";
    onlinePanel.style.display = showOnline ? "block" : "none";
    startBtn.style.display = showOnline ? "none" : "block";
    if (showOnline) setOnlineStatus("");
  });
  wireToggleGroup("onlineTabButtons", value => {
    document.getElementById("createTab").style.display = value === "create" ? "block" : "none";
    document.getElementById("joinTab").style.display = value === "create" ? "none" : "block";
    setOnlineStatus("");
  });

  document.getElementById("createRoomBtn").addEventListener("click", createRoom);
  document.getElementById("joinRoomBtn").addEventListener("click", () => {
    joinRoom(document.getElementById("joinCodeInput").value);
  });

  document.getElementById("startBtn").addEventListener("click", () => {
    teardownConnection();
    startScreen.classList.remove("show");
    applyThemeColors();
    updateSubtitle();
    resetScore();
    restart();
  });

  document.getElementById("restartBtn").addEventListener("click", restart);
  document.getElementById("overlayRestartBtn").addEventListener("click", restart);
  document.getElementById("changeModeBtn").addEventListener("click", openModeScreen);
  document.getElementById("overlayModeBtn").addEventListener("click", openModeScreen);
  document.getElementById("backToGameChoice").addEventListener("click", openGameChoiceScreen);

  // ================= Language toggle =================
  const langToggleBtn = document.getElementById("langToggle");
  function refreshAllText() {
    applyStaticTranslations();
    langToggleBtn.textContent = lang === "en" ? "VI" : "EN";
    if (startScreen.classList.contains("show")) {
      const g = G();
      modeScreenTitle.textContent = gameTitleText(g);
      const sideBtns = sideButtons.querySelectorAll(".mode-btn");
      sideBtns[0].textContent = sideLabel(g, true);
      sideBtns[1].textContent = sideLabel(g, false);
    }
    if (overlay.classList.contains("show") && lastWinner) renderGameOverPanel(lastWinner);
    applyThemeColors();
    updateStatus();
    updateSubtitle();
  }
  langToggleBtn.addEventListener("click", () => {
    lang = lang === "en" ? "vi" : "en";
    refreshAllText();
  });

  // ================= Init =================
  buildStaticLines();
  buildPoints();
  applyStaticTranslations();
  langToggleBtn.textContent = lang === "en" ? "VI" : "EN";
  applyThemeColors();
  syncPieces();
  updateStatus();
  refreshHighlights();
})();
</script>
</body>
</html>
