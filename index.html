<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Board Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #14181f;
    --panel: #1c222c;
    --line-dim: #6b6350;
    --point: #3a4150;
    --king: #d9973f;
    --king-glow: #f4c063;
    --pawn: #4f8fd1;
    --pawn-glow: #7db3ee;
    --white-pc: #eee6d4;
    --white-glow: #fffaf0;
    --black-pc: #2b3140;
    --black-glow: #4a5568;
    --legal: #5fbf7a;
    --capture: #e07a4a;
    --selected: #f4c063;
    --text: #eee6d4;
    --text-dim: #9aa0ad;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #1e2530 0%, var(--bg) 65%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    letter-spacing: 0.04em;
    margin: 4px 0 2px;
    text-align: center;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-bottom: 20px;
    text-align: center;
    min-height: 1.2em;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--panel);
    border: 1px solid #2c3341;
    border-radius: 14px;
    padding: 10px 22px;
    margin-bottom: 18px;
    font-family: 'Cinzel', serif;
  }

  .status-item { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
  .status-dot { width: 12px; height: 12px; border-radius: 50%; }
  .status-dot.a { background: var(--dot-a, var(--king)); box-shadow: 0 0 8px var(--dot-a-glow, var(--king-glow)); }
  .status-dot.b { background: var(--dot-b, var(--pawn)); box-shadow: 0 0 8px var(--dot-b-glow, var(--pawn-glow)); }
  .status-divider { width: 1px; height: 20px; background: #333c4c; }

  #turnLabel.active-a { color: var(--dot-a-glow, var(--king-glow)); }
  #turnLabel.active-b { color: var(--dot-b-glow, var(--pawn-glow)); }

  .board-wrap {
    position: relative;
    width: min(94vw, 480px);
    filter: drop-shadow(0 12px 28px rgba(0,0,0,0.45));
  }

  svg#board { width: 100%; height: auto; display: block; }

  .point-hit { cursor: default; }
  .point-hit.clickable { cursor: pointer; }

  .point-dot { transition: fill 0.15s ease; }
  .point-dot.legal { fill: var(--legal); }
  .point-dot.capture { fill: var(--capture); }
  .point-dot.selected { fill: var(--selected); }

  .piece-group { pointer-events: none; }

  .king-shape { fill: var(--king); }
  .pawn-shape { fill: var(--pawn); }
  .ck-white { fill: var(--white-pc); }
  .ck-black { fill: var(--black-pc); stroke: #8791a3; stroke-width: 1.5; }
  .ck-king-mark { fill: none; stroke-width: 2.5; }
  .ck-king-mark.on-white { stroke: var(--king); }
  .ck-king-mark.on-black { stroke: var(--king-glow); }

  .controls { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  button {
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    letter-spacing: 0.03em;
    background: var(--panel);
    color: var(--text);
    border: 1px solid #3a4356;
    border-radius: 10px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  button:hover { background: #262e3c; border-color: var(--king); }
  button:focus-visible { outline: 2px solid var(--king-glow); outline-offset: 2px; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 16, 0.82);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 16px;
  }
  .overlay.show { display: flex; }

  .overlay-card {
    background: var(--panel);
    border: 1px solid var(--line-dim);
    border-radius: 18px;
    padding: 32px 36px;
    text-align: center;
    max-width: 380px;
    width: 100%;
  }

  .overlay-card h2 {
    font-family: 'Cinzel', serif;
    font-size: 1.7rem;
    margin: 0 0 8px;
  }
  .overlay-card h2.a-win { color: var(--king-glow); }
  .overlay-card h2.b-win { color: var(--pawn-glow); }
  .overlay-card p { color: var(--text-dim); margin: 0 0 20px; font-size: 0.92rem; }

  .score-line {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1.15rem;
    margin: -6px 0 20px;
    padding: 10px;
    background: #232a36;
    border: 1px solid #333c4c;
    border-radius: 10px;
  }
  .score-line .score-a { color: var(--dot-a-glow, var(--king-glow)); }
  .score-line .score-b { color: var(--dot-b-glow, var(--pawn-glow)); }
  .score-line .score-sep { color: var(--text-dim); font-weight: 400; font-size: 0.9rem; }

  .game-pick-row { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
  .game-pick-btn {
    padding: 16px;
    font-size: 1.05rem;
    background: #232a36;
    border: 1px solid #333c4c;
    text-align: left;
  }
  .game-pick-btn strong { display: block; font-size: 1.1rem; margin-bottom: 4px; color: var(--king-glow); }
  .game-pick-btn span { font-family: 'Inter', sans-serif; font-size: 0.82rem; color: var(--text-dim); font-weight: 400; letter-spacing: 0; }
  .game-pick-btn:hover { border-color: var(--king-glow); }

  .mode-group { margin-bottom: 18px; text-align: left; }
  .mode-label {
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .mode-buttons { display: flex; gap: 8px; }
  .mode-btn {
    flex: 1;
    padding: 10px 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.88rem;
    background: #232a36;
    border: 1px solid #333c4c;
  }
  .mode-btn.active {
    background: rgba(217,151,63,0.18);
    border-color: var(--king-glow);
    color: var(--king-glow);
  }
  .start-btn {
    width: 100%;
    margin-top: 6px;
    background: var(--king);
    border-color: var(--king);
    color: #1c130a;
    font-weight: 700;
    padding: 12px;
  }
  .start-btn:hover { background: var(--king-glow); border-color: var(--king-glow); }

  .back-link {
    display: inline-block;
    margin-top: 14px;
    font-size: 0.8rem;
    color: var(--text-dim);
    cursor: pointer;
    text-decoration: underline;
  }
  .back-link:hover { color: var(--text); }

  .room-code {
    margin-top: 12px;
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--king-glow);
    background: #232a36;
    border: 1px dashed var(--king-glow);
    border-radius: 10px;
    padding: 10px;
  }

  .room-input {
    width: 100%;
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    letter-spacing: 0.1em;
    text-align: center;
    text-transform: uppercase;
    background: #232a36;
    border: 1px solid #333c4c;
    border-radius: 10px;
    color: var(--text);
    padding: 10px;
  }
  .room-input:focus { outline: none; border-color: var(--king-glow); }

  .online-status {
    margin-top: 12px;
    font-size: 0.85rem;
    color: var(--text-dim);
    text-align: center;
    min-height: 1.2em;
  }
  .online-status.error { color: #e07a7a; }
  .online-status.success { color: var(--legal); }

  .rules-note {
    max-width: 480px;
    margin-top: 26px;
    font-size: 0.82rem;
    line-height: 1.55;
    color: var(--text-dim);
    text-align: center;
  }
  .rules-note b { color: var(--text); }

  .lang-toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 20;
    padding: 8px 14px;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

  <button id="langToggle" class="lang-toggle">VI</button>

  <h1 id="gameTitle" data-i18n="appTitle">Board Games</h1>
  <div class="subtitle" id="subtitle" data-i18n="chooseGameToBegin">Choose a game to begin.</div>

  <div class="status-bar">
    <div class="status-item"><span class="status-dot a"></span><span id="turnLabel">Turn</span></div>
    <div class="status-divider"></div>
    <div class="status-item"><span class="status-dot b"></span><span id="pieceCount">&nbsp;</span></div>
  </div>

  <div class="board-wrap">
    <svg id="board" viewBox="0 0 450 450" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="controls">
    <button id="restartBtn" data-i18n="newGame">New Game</button>
    <button id="changeModeBtn" data-i18n="changeMode">Change Mode</button>
  </div>

  <div class="rules-note" id="rulesNote"></div>

  <!-- Top-level game chooser -->
  <div class="overlay show" id="gameChoiceScreen">
    <div class="overlay-card">
      <h2 data-i18n="chooseGameTitle">Choose a Game</h2>
      <p data-i18n="chooseGameSubtitle">Pick a game below.</p>
      <div class="game-pick-row">
        <button class="game-pick-btn" data-game="kap">
          <strong data-i18n="gcKapTitle">Kings &amp; Pawns</strong>
          
        </button>
        <button class="game-pick-btn" data-game="checkers">
          <strong data-i18n="gcCheckersTitle">Checkers</strong>
          
        </button>
        <button class="game-pick-btn" data-game="cothu">
          <strong data-i18n="gcCothuTitle">Cờ Thú (Jungle Chess)</strong>
          
        </button>
      </div>
    </div>
  </div>

  <!-- Mode-select screen (shared, relabeled per game) -->
  <div class="overlay" id="startScreen">
    <div class="overlay-card">
      <h2 id="modeScreenTitle">Kings &amp; Pawns</h2>
      <p data-i18n="modeScreenSubtitle">Choose your side and opponent</p>

      <div class="mode-group">
        <div class="mode-label" data-i18n="playAsLabel">Play as</div>
        <div class="mode-buttons" id="sideButtons">
          <button data-value="a" class="mode-btn active">King</button>
          <button data-value="b" class="mode-btn">Pawn</button>
        </div>
      </div>

      <div class="mode-group">
        <div class="mode-label" data-i18n="opponentLabel">Opponent</div>
        <div class="mode-buttons" id="opponentButtons">
          <button data-value="ai" class="mode-btn active" data-i18n="aiBtn">AI</button>
          <button data-value="player" class="mode-btn" data-i18n="localBtn">Local Player (2P)</button>
          <button data-value="online" class="mode-btn" data-i18n="onlineBtn">Online</button>
        </div>
      </div>

      <div class="mode-group" id="onlinePanel" style="display:none;">
        <div class="mode-buttons" id="onlineTabButtons" style="margin-bottom:10px;">
          <button data-value="create" class="mode-btn active online-tab" data-i18n="createRoomBtn">Create Room</button>
          <button data-value="join" class="mode-btn online-tab" data-i18n="joinRoomBtn">Join Room</button>
        </div>

        <div id="createTab">
          <button id="createRoomBtn" class="start-btn" style="margin-top:0;" data-i18n="createRoomBtn">Create Room</button>
          <div id="roomCodeDisplay" class="room-code" style="display:none;"></div>
        </div>

        <div id="joinTab" style="display:none;">
          <input id="joinCodeInput" class="room-input" data-i18n-placeholder="roomCodePlaceholder" placeholder="Enter room code" maxlength="6" autocapitalize="characters">
          <button id="joinRoomBtn" class="start-btn" style="margin-top:8px;" data-i18n="joinRoomBtn">Join Room</button>
        </div>

        <div id="onlineStatus" class="online-status"></div>
      </div>

      <button id="startBtn" class="start-btn" data-i18n="startGameBtn">Start Game</button>
      <div class="back-link" id="backToGameChoice" data-i18n="backToGameChoice">&larr; Choose a different game</div>
    </div>
  </div>

  <!-- Game over screen -->
  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <h2 id="overlayTitle">Kings Win!</h2>
      <p id="overlaySubtitle">All pawns have been captured.</p>
      <div id="scoreLine" class="score-line"></div>
      <button id="overlayRestartBtn" data-i18n="playAgainBtn">Play Again</button>
      <button id="overlayModeBtn" style="margin-top:8px;" data-i18n="changeMode">Change Mode</button>
    </div>
  </div>

<script src="js/board-core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/kap.js"></script>
<script src="js/checkers.js"></script>
<script src="js/cothu.js"></script>
<script src="js/cothu-images.js"></script>
<script src="js/rendering.js"></script>
<script src="js/network.js"></script>
<script src="js/app.js"></script>
</body>
</html>
